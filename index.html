<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>种草控制台</title>
<style>
html,body{height:100%;margin:0;background:#f3f7ff;font-family:system-ui,sans-serif;color:#243657}
iframe{display:block;width:100%;height:100%;border:0}
#loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:24px}
#loading p{color:#64748b;font-size:14px;line-height:1.7}
button{padding:10px 22px;border:1px solid #b8c9e7;border-radius:8px;background:white;color:#243657;cursor:pointer}
</style>
<!-- ECOM_TUNNEL_START -->
<script>window.CONSOLE_TUNNEL = "https://yarn-undo-postage-cape.trycloudflare.com";</script>
<!-- ECOM_TUNNEL_END -->
</head>
<body>
<div id="loading"><h2>正在连接种草控制台</h2><p id="message">继续使用原来的登录密码。</p><button id="retry" type="button">重新连接</button></div>
<iframe id="console" title="种草控制台" allow="clipboard-write; fullscreen" hidden></iframe>
<script>
const frame=document.getElementById('console');
const loading=document.getElementById('loading');
const message=document.getElementById('message');
const source='https://raw.githubusercontent.com/Underbobo/zhongcao-console/main/index.html';
let timer;
let attempt=0;
async function latestTunnel(){
  // Read the current source even when GitHub Pages is still serving an older build.
  try {
    const response=await fetch(source+'?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(6000)});
    if(response.ok){
      const html=await response.text();
      const current=html.match(/window\.CONSOLE_TUNNEL\s*=\s*"(https:\/\/[a-z0-9-]+\.trycloudflare\.com)"\s*;/);
      if(current) return current[1];
    }
  } catch {}
  return window.CONSOLE_TUNNEL;
}
async function connect(){
  const current=++attempt;
  loading.style.display='grid';
  message.textContent='继续使用原来的登录密码。';
  clearTimeout(timer);
  timer=setTimeout(()=>{message.textContent='连接时间较长。请确认运行控制台的电脑已开机，或点击重新连接。';},20000);
  const tunnel=await latestTunnel();
  if(current!==attempt) return;
  frame.src=tunnel+location.search+location.hash;
  frame.hidden=false;
}
frame.addEventListener('load',()=>{clearTimeout(timer);loading.style.display='none';});
document.getElementById('retry').addEventListener('click',connect);
window.addEventListener('hashchange',connect);
connect();
</script>
</body>
</html>
